name: 🐛 Bug Report
description: Report an issue or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: input
    id: android-version
    attributes:
      label: Android Version / API Level
      placeholder: "e.g., Android 14 (API 34)"
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: Device Model
      placeholder: "e.g., Pixel 8 Pro / Samsung Galaxy S23 / Android Emulator"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Launch app
        2. Click 'Sign in with Google'
        3. Cancel dialog
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logcat / Stacktrace
      description: Paste relevant Logcat output or stack traces here.
      render: shell
